<!DOCTYPE html>
<html>
<head>
    <title>IPL Match Winning Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>IPL Match Winning Prediction</h1>
        <form action="/predict" method="post">
            <div class="form-row">
                <div class="form-column">
                    <label for="batting_team">Batting Team:</label>
                    <select name="batting_team">
                        <option value="Punjab Kings">Punjab Kings</option>
                        <option value="Delhi Capitals">Delhi Capitals</option>
                        <option value="Royal Challengers Bangalore">Royal Challengers Bangalore</option>
                        <option value="Chennai Super Kings">Chennai Super Kings</option>
                        <option value="Mumbai Indians">Mumbai Indians</option>
                        <option value="Rajasthan Royals">Rajasthan Royals</option>
                        <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
                        <option value="Gujarat Titans">Gujarat Titans</option>
                        <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
                        <option value="Lucknow Super Giants">Lucknow Super Giants</option>
                    </select>
                </div>
                <div class="form-column">
                    <label for="bowling_team">Bowling Team:</label>
                    <select name="bowling_team">
                        <option value="Punjab Kings">Punjab Kings</option>
                        <option value="Delhi Capitals">Delhi Capitals</option>
                        <option value="Royal Challengers Bangalore">Royal Challengers Bangalore</option>
                        <option value="Chennai Super Kings">Chennai Super Kings</option>
                        <option value="Mumbai Indians">Mumbai Indians</option>
                        <option value="Rajasthan Royals">Rajasthan Royals</option>
                        <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
                        <option value="Gujarat Titans">Gujarat Titans</option>
                        <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
                        <option value="Lucknow Super Giants">Lucknow Super Giants</option>
                    </select>
                </div>
                <div class="form-column">
                    <label for="city">City:</label>
                    <select name="city">
                        <option value="Chandigarh">Chandigarh</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Kolkata">Kolkata</option>
                    </select>
                </div>
            </div>
            <hr>
            <div class="form-row">
                <div class="form-column">
                    <label for="runs_left">Runs Left:</label>
                    <input type="number" name="runs_left" id="runs_left">
                </div>
                <div class="form-column">
                    <label for="balls_left">Balls Left:</label>
                    <input type="number" name="balls_left" id="balls_left">
                </div>
                <div class="form-column">
                    <label for="wickets_left">Wickets Left:</label>
                    <input type="number" name="wickets_left">
                </div>
            </div>
            <div class="form-row">
                <div class="form-column">
                    <label for="current_run_rate">Current Run Rate:</label>
                    <input type="number" step="0.01" name="current_run_rate">
                </div>
                <div class="form-column">
                    <label for="target">Target:</label>
                    <input type="number" name="target">
                </div>
                <div class="form-column">
                    <label for="required_run_rate">Required Run Rate:</label>
                    <input type="text" id="required_run_rate" name="required_run_rate" readonly>
                </div>
            </div>
            <input type="submit" value="Predict">
        </form>
    </div>
    <script>
        function calculateRequiredRunRate() {
            let runsLeft = document.getElementById('runs_left').value;
            let ballsLeft = document.getElementById('balls_left').value;

            if (runsLeft && ballsLeft && ballsLeft > 0) {
                let requiredRunRate = (runsLeft / ballsLeft) * 6;
                document.getElementById('required_run_rate').value = requiredRunRate.toFixed(2);
            } else {
                document.getElementById('required_run_rate').value = "";
            }
        }

        document.getElementById('runs_left').addEventListener('input', calculateRequiredRunRate);
        document.getElementById('balls_left').addEventListener('input', calculateRequiredRunRate);
    </script>
</body>
</html>
